# Security updates only, for every ecosystem. A limit of zero opens no version
# pull request; a security update is not subject to the limit and arrives as
# soon as an advisory matches, from the repository's Dependabot security
# updates setting, which the repo-settings tool turns on. Each entry is kept,
# limit and all, so that the split is a decision rather than an omission.
#
# Version updates were turned off on 2026-10-19 by the driver's call, after
# the lint-tools group had sat red for a month on three major bumps (#134).
# What they used to move, the action SHAs, the base image digests and the Node
# linters, now moves by hand when there is a reason to: an advisory, a Trivy
# red, a tool fix wand needs. Go modules were already this way (spec #33,
# section 16; ticket #56, on the security posture decision #31).
version: 2
updates:
  # The Gate's actions, each pinned to a full-length commit SHA with its
  # version in a trailing comment, which the repository's Actions policy
  # requires. GitHub's advisory database covers actions, so a vulnerable pin
  # still gets a pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # docker/Dockerfile and docker/dev.Dockerfile, both matched by name in that
  # one directory, their base images pinned by digest. No advisory database
  # covers an image, so nothing arrives here on its own: a Trivy red is
  # answered by moving the digest by hand (spec #33, section 14; ticket #55).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The Node linters of the generate Gate, installed from the lockfile with
  # npm ci. An advisory against anything in that tree still opens a pull
  # request; a newer linter is a hand change to package.json.
  - package-ecosystem: npm
    directory: /internal/tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Go modules: a satellite release or the Nightly `go get -u ./...` is what
  # prompts a hand pull request that moves go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
