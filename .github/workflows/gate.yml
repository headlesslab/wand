# The Gate: every pull request, and every push to main, proves wand on the
# four Tier 1 platforms with a real browser and -race (the seven Tier 1 jobs:
# linux/amd64 and linux/arm64 on Go stable and on the Go floor, windows/amd64
# and darwin/arm64 on stable, and linux/amd64 once more on the Companion
# Chromium), builds, vets and compiles the tests for the three Tier 2 targets
# on both Go versions (the three Tier 2 jobs), keeps statement coverage at
# 100 % on the linux/amd64 stable job, regenerates everything from the
# pinned inputs and lints, which must leave the tree unchanged (the generate
# job), and builds the two container images natively on each Linux
# architecture, runs the whole suite inside the development one and scans
# both with Trivy (the two image jobs). Every Tier 1 job asserts that the
# browser it ran on is the pin, and every job that launches one ends by
# proving that no browser process or user data directory was left behind.
# Two more Gates read what the code depends on rather than what it does:
# govulncheck on the linux/amd64 stable job, and the dependency review job on
# what a pull request adds to the graph. The main ruleset requires every job
# as a status check, so a red run blocks the merge and nothing else (spec
# #33, sections 12, 13, 14 and 16; tickets #36, #42, #54, #55 and #56).
#
# CodeQL is not here: its default setup runs a workflow GitHub keeps, and the
# main ruleset's code scanning rule is what holds a pull request to it (the
# repo-settings tool applies both).
#
# Every action is pinned to a full-length commit SHA with its version in a
# trailing comment; Dependabot moves the pins weekly (.github/dependabot.yml).
name: Gate

# A pull request is checked as its merge result; a push to a branch is not
# checked on its own, since the pull request that carries it is, and the two
# runs of one commit that both events gave cost a matrix each and could
# block the merge on a red push run beside a green pull-request run. A push
# to main, the merge itself, is checked, so main's own history is green run
# by green run (spec #33, section 13, amended in a comment on #33).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never download a newer toolchain: a dependency raising its Go floor above
  # ours must fail the run, not silently pull a toolchain.
  GOTOOLCHAIN: local

# One shell on every runner, Windows included, so that each step is written
# once for the four platforms.
defaults:
  run:
    shell: bash

jobs:
  # Tier 1: every package from the workspace root with -race, on the Managed
  # browser that Browser resolution downloads on every run (no cache action,
  # so every run exercises the download and the hash verification). One job
  # per entry below, each a required check under its name.
  tier1:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # branded: the runner ships the branded Google Chrome, so the User
          # mode Confirmed fix is proven there. coverage: the one job that
          # holds the suite to 100 %. govulncheck: the one job whose Go is
          # new enough to build x/vuln.
          - name: Tier 1 linux/amd64 (Go stable)
            runner: ubuntu-latest
            go: stable
            source: chrome
            branded: true
            coverage: true
            govulncheck: true
            artifact: linux-amd64-stable
          - name: Tier 1 linux/amd64 (Go 1.21)
            runner: ubuntu-latest
            go: 1.21.x
            source: chrome
            artifact: linux-amd64-go1.21
          - name: Tier 1 linux/arm64 (Go stable)
            runner: ubuntu-24.04-arm
            go: stable
            source: chrome
            artifact: linux-arm64-stable
          - name: Tier 1 linux/arm64 (Go 1.21)
            runner: ubuntu-24.04-arm
            go: 1.21.x
            source: chrome
            artifact: linux-arm64-go1.21
          - name: Tier 1 windows/amd64 (Go stable)
            runner: windows-latest
            go: stable
            source: chrome
            branded: true
            artifact: windows-amd64-stable
          - name: Tier 1 darwin/arm64 (Go stable)
            runner: macos-latest
            go: stable
            source: chrome
            branded: true
            artifact: darwin-arm64-stable
          - name: Tier 1 linux/amd64 (Companion Chromium)
            runner: ubuntu-latest
            go: stable
            source: chromium
            artifact: linux-amd64-chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # The body of the job — the browser, the pin assertion, the suite — is
      # in .github/actions/tier1, because the Nightly reruns this very matrix
      # on main once a night (#61) and a fix to any one of those steps has to
      # reach both.
      - uses: ./.github/actions/tier1
        with:
          source: ${{ matrix.source }}
          branded: ${{ matrix.branded }}
          coverage: ${{ matrix.coverage }}
          govulncheck: ${{ matrix.govulncheck }}

      # The CDP logs of the failed tests (the root suite removes a passed
      # test's), the coverage profile and the browser line.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cdp-log-${{ matrix.artifact }}
          path: |
            tmp/cdp-log
            coverage.out
            browser.log

      # Zero leftover: whatever the outcome above, the job ends by waiting up
      # to 30 s for the last browser to be gone and fails on any chrome or
      # chromium process still running or any user data directory the
      # launcher left under its temporary prefix; what is left is listed.
      - name: Zero leftover
        if: always()
        run: go run ./internal/tools/zero-leftover

  # Tier 2: built and vetted, and every test binary compiled, on the Go floor
  # and then on Go stable, never run with a browser (CONTEXT.md, Support
  # tier). macOS on amd64 and Windows on arm64 natively; linux/loong64
  # cross-compiled on ubuntu-latest, as no hosted runner exists for it. One
  # job per target, each a required check under its name.
  #
  # `go test -c` with -o at the null device links every test binary and
  # runs none: a run of no test would still launch the runner's Chrome
  # through Browser resolution, which is Tier 1's job, and cannot happen at
  # all for loong64. (A directory would do as well, but three packages are
  # named generate, and Go 1.21 refuses to write a second generate.test.)
  tier2:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tier 2 darwin/amd64
            runner: macos-15-intel
          - name: Tier 2 windows/arm64
            runner: windows-11-arm
          - name: Tier 2 linux/loong64
            runner: ubuntu-latest
            goos: linux
            goarch: loong64
    env:
      # Empty for the native targets, which is Go's default.
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go floor: the version go.mod declares, at its latest patch. The
      # two example modules are named as in Tier 1; e2e-testing has only
      # test files, so compiling the tests is the one step that builds it.
      - name: Go floor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.21.x
          check-latest: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - run: go version

      - run: go build ./... ./lib/examples/custom-websocket

      - run: go vet ./... ./lib/examples/custom-websocket ./lib/examples/e2e-testing

      - name: Compile the tests (Go floor)
        run: go test -c -o "$([[ "$RUNNER_OS" == Windows ]] && echo NUL || echo /dev/null)" ./... ./lib/examples/custom-websocket ./lib/examples/e2e-testing

      # Go stable, the same steps.
      - name: Go stable
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - run: go version

      - run: go build ./... ./lib/examples/custom-websocket

      - run: go vet ./... ./lib/examples/custom-websocket ./lib/examples/e2e-testing

      - name: Compile the tests (Go stable)
        run: go test -c -o "$([[ "$RUNNER_OS" == Windows ]] && echo NUL || echo /dev/null)" ./... ./lib/examples/custom-websocket ./lib/examples/e2e-testing

  # The generate Gate: every go:generate step of browser.go, in its order,
  # from the pinned inputs (the devtools-protocol tag the pins name, the
  # committed JS and assets, the pinned devices commit), then the lint step,
  # which runs the Node linters from internal/tools/package-lock.json and
  # golangci-lint at the version internal/devutil pins (its formatters are
  # gofumpt and goimports at the versions it bundles), and ends by requiring
  # an empty git status. So the committed protocol package is byte for byte
  # what the pins and the schema give, the pins re-derive, and no @latest or
  # bare npx takes part (spec #33, sections 4 and 13; ADR-0004; ticket #42).
  # No browser is involved.
  generate:
    name: Generate (zero diff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/tools/package-lock.json

      - run: go version && node --version

      # go mod download, npm ci for the Node tools, .dockerignore.
      - run: go run ./internal/tools/setup

      # The Protocol roll re-derives from the branch position (one git
      # ls-remote) and every pins output re-renders to the committed bytes.
      - run: go run ./lib/launcher/pins/generate -check

      # lib/proto from the devtools-protocol tag the pins name; the []byte
      # count is checked against the tag's PDL files. The summary it prints
      # is empty here, since the committed package is what it regenerates.
      - run: go run ./lib/proto/generate

      - run: go run ./lib/js/generate

      - run: go run ./internal/assets/generate

      - run: go run ./lib/devices/generate

      # cspell, eslint, prettier, golangci-lint fmt and run, the Must-prefix
      # rule, then an empty git status --porcelain.
      - run: go run ./internal/tools/lint

      # What drifted, when a generator or a formatter rewrote something.
      - name: Show the drift
        if: failure()
        run: |
          git status --porcelain
          git diff | head -300

  # Dependency review: everything a pull request adds to the dependency graph
  # — a module in go.mod or go.sum, an action in a workflow, a package in the
  # lint lockfile — must carry no advisory of high severity or worse and no
  # licence outside the allowlist. GitHub compares the graph of the two
  # commits, so nothing is built or downloaded here. The allowlist is what the
  # security posture decision (#31) fixed: the permissive licences a
  # mainstream library carries, copyleft out. Widening it is a reviewed change
  # to this file (spec #33, section 16; ticket #56).
  #
  # The comparison needs a pull request's two commits, which a push to main
  # does not have, so this Gate belongs to that event alone: what it would
  # find on main it found on the pull request that brought it there.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0

  # The image Gate: the runtime image and the :dev image on top of it, built
  # natively on each Linux architecture (no QEMU, no cross build), the whole
  # suite run inside the :dev one, and Trivy over both. Nothing is pushed:
  # the tags are the release workflow's, and this job only proves that the
  # image a release would publish builds and works (spec #33, section 14;
  # ADR-0005; ticket #55). One job per architecture, each a required check
  # under its name.
  #
  # The image carries the Target Chrome the pins name, pre-fetched at build
  # time through Browser resolution's own download path, so the browser here
  # is the one the Tier 1 jobs ran on; the build script holds the version it
  # reports to the pin, which is what makes the two architectures carry the
  # same Chrome. In the container utils.InContainer holds, so the launcher
  # passes --no-sandbox and the AppArmor sysctl the Tier 1 Linux jobs need
  # has nothing to do here.
  image:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Image linux/amd64
            runner: ubuntu-latest
            artifact: image-linux-amd64
          - name: Image linux/arm64
            runner: ubuntu-24.04-arm
            artifact: image-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go on the runner is the build script's, not the image's: the image
      # builds with the Go its own base image pins by digest.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - run: go version && docker version

      # Builds both images, runs the manager out of the runtime one and holds
      # the Chrome inside it to the Target Chrome pin.
      - name: Build the images
        run: go run ./internal/tools/docker

      # Trivy over the operating system packages and the Go and Node
      # dependencies of each image. --ignore-unfixed leaves what no upgrade
      # would fix, so a red step is always something a base image digest or a
      # dependency bump can move; Dependabot's docker ecosystem keeps the
      # digests coming. The published tags are scanned again by the Nightly.
      - name: Trivy on the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/headlesslab/wand:latest
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Trivy on the development image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/headlesslab/wand:dev
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      # The whole suite in the container, on this checkout mounted into it,
      # which is what covers InContainer mapping to --no-sandbox and the
      # container-only font test. The build the script repeats here is a
      # cache hit of the step above; splitting the two keeps Trivy's answer
      # ahead of the long run and the two logs apart. The Zero leftover check
      # runs inside the container as well, in the PID namespace the suite's
      # browsers ran in.
      - name: The suite in the container
        run: go run ./internal/tools/docker -suite

      # The CDP logs of the failed tests and the PDF of the font test, which
      # runs only in a container and is looked at rather than asserted; both
      # were written into the mounted checkout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cdp-log-${{ matrix.artifact }}
          path: |
            tmp/cdp-log
            tmp/fonts.pdf

      # Zero leftover once more from the host, where a container's processes
      # are visible however its own namespace numbers them, so a browser that
      # outlived its container is found here.
      - name: Zero leftover
        if: always()
        run: go run ./internal/tools/zero-leftover
