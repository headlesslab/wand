# OpenSSF Scorecard: the supply-chain posture a stranger can read off the
# badge in both READMEs, measured weekly and on every push to main. It is
# neither a Gate nor a Nightly: it blocks no merge and opens no issue. Every
# run publishes to the OpenSSF API, which is what the badge and the public
# dataset read, and uploads its SARIF to code scanning, where a failing check
# is one alert beside CodeQL's (spec #33, section 16; ticket #56).
#
# The API accepts results only from a workflow it can vouch for, and reads
# this file at the analysed commit to do so: hence no workflow-level env or
# defaults, no write permission outside the one job, no container, an Ubuntu
# runner, and steps that are only `uses` of the actions it allows. That is
# why Scorecard sits in a file of its own rather than in the Gate, which has
# both a workflow-level env and defaults.
#
# The Branch-Protection check reads the main ruleset, which the run's own
# GITHUB_TOKEN may read; classic branch protection would have needed an admin
# token, and no personal access token exists (spec #33, section 15).
name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Monday 04:38 UTC. Off the hour, where the scheduler is busiest
    # and a run is queued longest.
    - cron: '38 4 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The SARIF upload to code scanning.
      security-events: write
      # The OIDC token that signs the results the API publishes.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # What makes the badge and the public dataset current; without it
          # the OpenSSF's own weekly scan of public repositories is what a
          # reader sees instead.
          publish_results: true

      # The SARIF for five days, for reading a check's reasoning without the
      # code scanning dashboard.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
